# Additive vhost. Certificates must exist before nginx -t/reload.
# Nginx must join the service's explicit edge network.
map $http_upgrade $pl_chat_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name chat.pingxingxian.space;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://chat.pingxingxian.space$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name chat.pingxingxian.space;
    ssl_certificate /etc/letsencrypt/live/chat.pingxingxian.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.pingxingxian.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $pl_chat_upstream parallellines-chat:8080;
    client_max_body_size 50m;
    # BEGIN pl-chat-immutable-cache
    # 仅缓存内容哈希资源；不向公共静态资源转发会话或认证信息。
    location ^~ /_app/immutable/ {
        proxy_pass http://$pl_chat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable";
        proxy_buffering on;
        proxy_cache off;
    }
    # END pl-chat-immutable-cache
    location / {
        # HTML、登录、接口和流式对话不得进入浏览器或 CDN 内容缓存。
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_pass http://$pl_chat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pl_chat_connection;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
