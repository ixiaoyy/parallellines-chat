services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.12.5@sha256:0caf3d68199bcd8b7051775778691dfa5f3c8a355d1d6484000171b2974f40f9
    platform: linux/amd64
    ports:
      - "127.0.0.1:${CHAT_LOOPBACK_PORT:-18080}:8080"
    env_file:
      - ${CHAT_SECRETS_ENV:?Set a server-only absolute env path}
    environment:
      WEBUI_URL: https://chat.pingxingxian.space
      ENABLE_PERSISTENT_CONFIG: "true"
      ENABLE_OAUTH_PERSISTENT_CONFIG: "false"
      ENABLE_OAUTH: "true"
      OPENID_PROVIDER_URL: https://pingxingxian.space/auth/oidc/.well-known/openid-configuration
      OAUTH_CLIENT_ID: parallellines-openwebui
      OPENID_REDIRECT_URI: https://chat.pingxingxian.space/oauth/oidc/login/callback
      OAUTH_PROVIDER_NAME: 平行线账号
      OAUTH_SCOPES: openid profile email offline_access
      OAUTH_AUTHORIZE_PARAMS: '{"prompt":"consent"}'
      OAUTH_REFRESH_TOKEN_INCLUDE_SCOPE: "false"
      OAUTH_CODE_CHALLENGE_METHOD: S256
      OAUTH_TOKEN_ENDPOINT_AUTH_METHOD: client_secret_basic
      ENABLE_OAUTH_EMAIL_FALLBACK: "true"
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "false"
      ENABLE_OAUTH_SIGNUP: "true"
      ENABLE_OAUTH_ROLE_MANAGEMENT: "false"
      ENABLE_OAUTH_GROUP_MANAGEMENT: "false"
      OAUTH_AUTO_REDIRECT: "false"
      DEFAULT_USER_ROLE: user
      ENABLE_SIGNUP: "false"
      ENABLE_LOGIN_FORM: "false"
      # Existing recovery admin retained until verified account handover.
      ENABLE_PASSWORD_AUTH: "true"
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "false"
      ENABLE_FORWARD_USER_INFO_HEADERS: "false"
      ENABLE_BASE_MODELS_CACHE: "false"
      OFFLINE_MODE: "true"
      RAG_EMBEDDING_MODEL: ""
    volumes:
      - type: bind
        source: ${CHAT_DATA_DIR:?Set a data-disk path}
        target: /app/backend/data
        bind:
          create_host_path: false
    networks:
      edge:
        aliases: [parallellines-chat]
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:?Set the explicitly attached reverse-proxy network}
